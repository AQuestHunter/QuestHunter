# Build the Vite app in the subfolder (Git root = "Quest Hunter", app lives in quest-hunter-web/).
# Ensure Netlify UI does not override this: Site settings → Build & deploy → clear custom
# publish directory / command if they conflict with this file.

[build]
  command = "cd quest-hunter-web && npm ci && npm run build"
  publish = "quest-hunter-web/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
